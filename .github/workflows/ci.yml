name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: System libraries (file-type detection for uploads)
        run: sudo apt-get update && sudo apt-get install -y libmagic1
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - name: Migrations are committed
        run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test
      - name: Static files collect (vendored libraries, fonts)
        run: python manage.py collectstatic --noinput
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Built CSS is up to date
        run: |
          npm ci
          npm run build:css
          git diff --exit-code static/css/tailwind.css
      - name: Browser script tests (money, product search)
        run: npm run test:js

  test-postgres:
    # The whole test suite on PostgreSQL, the database production runs on (the `test` job uses SQLite).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      USE_POSTGRES: 'True'
      PGDATABASE: ci
      PGUSER: ci
      PGPASSWORD: ci
      PGHOST: localhost
      PGPORT: '5432'
      PGSSLMODE: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libmagic1
      - run: pip install -r requirements.txt
      - run: python manage.py migrate --noinput
      - run: python manage.py test

  docker:
    # Builds the production image and starts the whole stack (web + PostgreSQL + nginx).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose file is valid
        run: |
          cp .env.docker.example .env
          sed -i 's/^PGPASSWORD=.*/PGPASSWORD=ci-only/; s/^DJANGO_SECRET_KEY=.*/DJANGO_SECRET_KEY=ci-only-not-a-secret/; s/^REPLIT_DOMAINS=.*/REPLIT_DOMAINS=localhost,127.0.0.1/' .env
          docker compose config -q
      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 240
      - name: Health check through nginx
        run: curl -fsS http://localhost/healthz/
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=100
      - run: docker compose down -v
