name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: System libraries (file-type detection for uploads)
        run: sudo apt-get update && sudo apt-get install -y libmagic1
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - name: Migrations are committed
        run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Built CSS is up to date
        run: |
          npm ci
          npm run build:css
          git diff --exit-code static/css/tailwind.css
