{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خطای سرور - ملک آیدی</title>
    <link rel="stylesheet" href="{% static 'vendor/bootstrap/bootstrap.rtl.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/vazirmatn.css' %}">
    <style>
        * {
            font-family: 'Vazirmatn', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1e40af 0%, #1e3a8a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error-container {
            background: white;
            padding: 3rem;
            border-radius: 1.5rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            text-align: center;
        }
        .error-code {
            font-size: 6rem;
            font-weight: 700;
            background: linear-gradient(135deg, #1e40af 0%, #1e3a8a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
    <link rel="stylesheet" href="{% static 'css/melkid-design.css' %}">
</head>
<body class="mk-bs">
    <div class="error-container">
        <div class="error-code">500</div>
        <h1 class="mb-4">خطای سرور</h1>
        <p class="lead mb-4">
            متأسفانه خطایی در سرور رخ داده است. لطفاً بعداً دوباره تلاش کنید.
        </p>
        
        {% if exception and debug %}
        <div class="alert alert-danger text-start mt-4">
            <strong>خطا:</strong>
            <pre class="mb-0 mt-2">{{ exception }}</pre>
        </div>
        {% endif %}
        
        <div class="mt-4">
            <a href="/" class="btn btn-primary">بازگشت به صفحه اصلی</a>
            <a href="javascript:history.back()" class="btn btn-outline-secondary">بازگشت به صفحه قبل</a>
        </div>
    </div>
</body>
</html>
