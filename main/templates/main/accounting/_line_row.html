<tr class="line">
    <td><select name="account" class="form-select form-select-sm" aria-label="حساب"><option value="">—</option>{% for a in accounts %}<option value="{{ a.id }}" {% if r.account|stringformat:"s" == a.id|stringformat:"s" %}selected{% endif %}>{{ a.code }} - {{ a.title }}</option>{% endfor %}</select></td>
    <td><select name="party" class="form-select form-select-sm" aria-label="طرف حساب"><option value="">—</option>{% for p in parties %}<option value="{{ p.id }}" {% if r.party|stringformat:"s" == p.id|stringformat:"s" %}selected{% endif %}>{{ p.name }}</option>{% endfor %}</select></td>
    <td><select name="cost_center" class="form-select form-select-sm" aria-label="مرکز هزینه"><option value="">—</option>{% for c in cost_centers %}<option value="{{ c.id }}" {% if r.cost_center|stringformat:"s" == c.id|stringformat:"s" %}selected{% endif %}>{{ c.title }}</option>{% endfor %}</select></td>
    <td><input name="line_description" class="form-control form-control-sm" maxlength="500" value="{{ r.line_description }}" aria-label="شرح ردیف"></td>
    <td><input name="debit" class="form-control form-control-sm amount" inputmode="numeric" dir="ltr" value="{{ r.debit }}" aria-label="بدهکار"></td>
    <td><input name="credit" class="form-control form-control-sm amount" inputmode="numeric" dir="ltr" value="{{ r.credit }}" aria-label="بستانکار"></td>
    <td><button type="button" class="btn btn-sm btn-outline-danger remove-line" aria-label="حذف ردیف"><i class="fas fa-xmark"></i></button></td>
</tr>
