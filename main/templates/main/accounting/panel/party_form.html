{% load accounting_tags %}
{% include 'main/accounting/panel/_modal_head.html' with title='طرف حساب جدید' %}
<form method="post" hx-post="{% url 'main:acc_p_party_new' %}" hx-target="#acc-modal-body" hx-swap="innerHTML" class="p-5" novalidate>
    {% csrf_token %}
    <div class="grid grid-cols-2 gap-3">
        <div class="col-span-2 md:col-span-1"><label class="acc-label" for="pt-kind">نوع</label><select class="acc-input" id="pt-kind" name="kind"><option value="real">حقیقی</option><option value="legal" {% if p.kind == 'legal' %}selected{% endif %}>حقوقی</option></select></div>
        <div class="col-span-2 md:col-span-1"><label class="acc-label" for="pt-nid">کد ملی (۱۰ رقم) / شناسه ملی (۱۱ رقم)</label><input class="acc-input" id="pt-nid" name="national_id" inputmode="numeric" dir="ltr" maxlength="11" value="{{ p.national_id }}"></div>
        <div class="col-span-2"><label class="acc-label" for="pt-name">نام</label><input class="acc-input" id="pt-name" name="name" maxlength="200" value="{{ p.name }}" required></div>
        <div><label class="acc-label" for="pt-mobile">همراه</label><input class="acc-input" id="pt-mobile" name="mobile" inputmode="tel" dir="ltr" maxlength="20" value="{{ p.mobile }}"></div>
        <div><label class="acc-label" for="pt-phone">تلفن</label><input class="acc-input" id="pt-phone" name="phone" inputmode="tel" dir="ltr" maxlength="20" value="{{ p.phone }}"></div>
        <div class="col-span-2"><label class="acc-label" for="pt-addr">نشانی</label><input class="acc-input" id="pt-addr" name="address" maxlength="500" value="{{ p.address }}"></div>
    </div>
    <div class="flex justify-end gap-2 mt-5"><button type="button" class="acc-btn" data-acc-close>انصراف</button><button type="submit" class="acc-btn-primary"><i class="fas fa-floppy-disk ml-1" aria-hidden="true"></i>ذخیره</button></div>
</form>
