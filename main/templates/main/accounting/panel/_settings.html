{% load accounting_tags %}
{% for s in sections %}
<div class="ac-card" style="margin-bottom:14px">
    <div class="ac-tools"><h3 class="ac-sec-title" style="margin:0">{{ s.title }}</h3><span class="ac-spaced"></span>
        <button type="button" class="ac-btn ac-btn-brand" hx-get="{{ s.new_url }}" hx-target="#acc-modal-body"><i class="fas fa-plus" aria-hidden="true"></i>{{ s.label }} جدید</button></div>
    <div class="ac-table-wrap"><table>
        <thead><tr>{% for h in s.columns %}<th>{{ h }}</th>{% endfor %}<th><span class="ac-sr">عملیات</span></th></tr></thead>
        <tbody>
        {% for r in s.rows %}<tr>{% for c in r.cells %}<td>{{ c|fa }}</td>{% endfor %}
            <td><div class="acts"><form hx-post="{{ r.delete }}" hx-swap="none" hx-confirm="حذف شود؟">{% csrf_token %}<button type="submit" class="ac-link bad"><i class="fas fa-trash" aria-hidden="true"></i>حذف</button></form></div></td></tr>
        {% empty %}<tr><td colspan="{{ s.columns|length|add:1 }}" class="muted" style="text-align:center;padding:16px">موردی ثبت نشده است.</td></tr>{% endfor %}
        </tbody>
    </table></div>
</div>
{% endfor %}
