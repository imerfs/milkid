<tr class="line">
    <td class="p-1"><select name="account" class="acc-input min-w-[12rem]" aria-label="حساب"><option value="">—</option>{% for a in accounts %}<option value="{{ a.id }}" {% if r.account|stringformat:"s" == a.id|stringformat:"s" %}selected{% endif %}>{{ a.code }} - {{ a.title }}</option>{% endfor %}</select></td>
    <td class="p-1"><select name="party" class="acc-input min-w-[8rem]" aria-label="طرف حساب"><option value="">—</option>{% for p in parties %}<option value="{{ p.id }}" {% if r.party|stringformat:"s" == p.id|stringformat:"s" %}selected{% endif %}>{{ p.name }}</option>{% endfor %}</select></td>
    <td class="p-1"><select name="cost_center" class="acc-input min-w-[7rem]" aria-label="مرکز هزینه"><option value="">—</option>{% for c in cost_centers %}<option value="{{ c.id }}" {% if r.cost_center|stringformat:"s" == c.id|stringformat:"s" %}selected{% endif %}>{{ c.title }}</option>{% endfor %}</select></td>
    <td class="p-1"><input name="line_description" class="acc-input min-w-[8rem]" maxlength="500" value="{{ r.line_description }}" aria-label="شرح ردیف"></td>
    <td class="p-1"><input name="debit" class="acc-input amount min-w-[7rem]" inputmode="numeric" dir="ltr" value="{{ r.debit }}" aria-label="بدهکار"></td>
    <td class="p-1"><input name="credit" class="acc-input amount min-w-[7rem]" inputmode="numeric" dir="ltr" value="{{ r.credit }}" aria-label="بستانکار"></td>
    <td class="p-1"><button type="button" class="remove-line text-error-500 hover:text-error-700 w-8 h-8" aria-label="حذف ردیف"><i class="fas fa-xmark" aria-hidden="true"></i></button></td>
</tr>
