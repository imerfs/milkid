<tr class="line">
    <td><select name="account" class="ac-in" style="min-width:12rem" aria-label="حساب"><option value="">—</option>{% for a in accounts %}<option value="{{ a.id }}" {% if r.account|stringformat:"s" == a.id|stringformat:"s" %}selected{% endif %}>{{ a.code }} - {{ a.title }}</option>{% endfor %}</select></td>
    <td><select name="party" class="ac-in" style="min-width:8rem" aria-label="طرف حساب"><option value="">—</option>{% for p in parties %}<option value="{{ p.id }}" {% if r.party|stringformat:"s" == p.id|stringformat:"s" %}selected{% endif %}>{{ p.name }}</option>{% endfor %}</select></td>
    <td><select name="cost_center" class="ac-in" style="min-width:7rem" aria-label="مرکز هزینه"><option value="">—</option>{% for c in cost_centers %}<option value="{{ c.id }}" {% if r.cost_center|stringformat:"s" == c.id|stringformat:"s" %}selected{% endif %}>{{ c.title }}</option>{% endfor %}</select></td>
    <td><input name="line_description" class="ac-in" style="min-width:8rem" maxlength="500" value="{{ r.line_description }}" aria-label="شرح ردیف"></td>
    <td><input name="debit" class="ac-in amount" style="min-width:7rem" inputmode="numeric" dir="ltr" value="{{ r.debit }}" aria-label="بدهکار"></td>
    <td><input name="credit" class="ac-in amount" style="min-width:7rem" inputmode="numeric" dir="ltr" value="{{ r.credit }}" aria-label="بستانکار"></td>
    <td><button type="button" class="remove-line ac-x" aria-label="حذف ردیف"><i class="fas fa-xmark" aria-hidden="true"></i></button></td>
</tr>
