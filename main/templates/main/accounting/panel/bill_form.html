{% load accounting_tags %}
{% include 'main/accounting/panel/_modal_head.html' with title='صدور فیش نقدی' %}
<form method="post" hx-post="{% url 'main:acc_p_bill_new' year.id %}" hx-target="#acc-modal-body" hx-swap="innerHTML" class="p-5" novalidate>
    {% csrf_token %}
    <div class="grid grid-cols-2 gap-3">
        <div class="col-span-2 md:col-span-1"><label class="acc-label" for="f-date">تاریخ (شمسی)</label><input class="acc-input" id="f-date" name="date" dir="ltr" placeholder="۱۴۰۴/۰۲/۱۱" value="{{ p.date }}" required></div>
        <div class="col-span-2 md:col-span-1"><label class="acc-label" for="f-amount">مبلغ (ریال)</label><input class="acc-input" id="f-amount" name="amount" inputmode="numeric" dir="ltr" value="{{ p.amount }}" required></div>
        <div class="col-span-2"><label class="acc-label" for="f-party">پرداخت‌کننده</label>
            <select class="acc-input" id="f-party" name="party" required><option value="">انتخاب کنید</option>{% for x in parties %}<option value="{{ x.id }}" {% if p.party == x.id|stringformat:'s' %}selected{% endif %}>{{ x.name }}</option>{% endfor %}</select>
            <a class="text-xs text-primary-600 hover:underline" href="{% url 'main:acc_parties' %}">افزودن طرف حساب جدید</a></div>
        <div class="col-span-2"><label class="acc-label" for="f-income">حساب درآمد</label>
            <select class="acc-input" id="f-income" name="income_account" required><option value="">انتخاب کنید</option>{% for a in incomes %}<option value="{{ a.id }}" {% if p.income_account == a.id|stringformat:'s' %}selected{% endif %}>{{ a.code|fa }} - {{ a.title }}</option>{% endfor %}</select></div>
        <div class="col-span-2"><label class="acc-label" for="f-desc">شرح</label><input class="acc-input" id="f-desc" name="description" maxlength="500" value="{{ p.description }}" required></div>
    </div>
    <div class="flex justify-end gap-2 mt-5">
        <button type="button" class="acc-btn" data-acc-close>انصراف</button>
        <button type="submit" class="acc-btn-success"><i class="fas fa-receipt ml-1" aria-hidden="true"></i>صدور فیش</button>
    </div>
</form>
