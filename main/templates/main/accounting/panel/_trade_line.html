{% load accounting_tags %}
<tr class="line">
    {% for name, label, kind in columns %}
    <td>{% if kind == 'product' %}<select name="{{ name }}" class="ac-in" style="min-width:14rem" aria-label="{{ label }}" data-trade-product><option value="">—</option>{% for pr in products %}<option value="{{ pr.id }}" data-price="{{ pr.price }}" data-buy="{{ pr.buy }}" {% if r|get:name|stringformat:'s' == pr.id|stringformat:'s' %}selected{% endif %}>{{ pr.label }}</option>{% endfor %}</select>
        {% else %}<input name="{{ name }}" class="ac-in" style="min-width:6.5rem" inputmode="decimal" dir="ltr" value="{{ r|get:name }}" aria-label="{{ label }}" data-trade-{{ name }}>{% endif %}</td>
    {% endfor %}
    {% if show_totals %}<td class="num-cell" data-trade-rowtotal>۰</td>{% endif %}
    <td><button type="button" class="ac-x" data-trade-remove aria-label="حذف ردیف"><i class="fas fa-xmark" aria-hidden="true"></i></button></td>
</tr>
