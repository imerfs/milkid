<div{% if span %} class="md:col-span-2"{% endif %}>
    <label for="f-{{ name }}" class="block font-medium mb-2">{{ label }}{% if required %}<span class="text-red-500">*</span>{% endif %}</label>
    <input type="file" id="f-{{ name }}" name="{{ name }}" accept="{{ accept|default:'.pdf,.jpg,.jpeg,.png' }}"{% if multiple %} multiple{% endif %}{% if required %} data-required="1"{% endif %} class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-green-50 file:text-green-700 hover:file:bg-green-100">
    {% if hint %}<p class="text-xs text-gray-500 mt-1">{{ hint }}</p>{% endif %}
    {% if error %}<p class="text-sm text-red-600 mt-1">{{ error }}</p>{% endif %}
</div>
