<div{% if span %} class="md:col-span-2"{% endif %}>
    <label for="f-{{ prefix }}{{ name }}" class="block font-medium mb-2">{{ label }}{% if required %}<span class="text-red-500">*</span>{% endif %}</label>
    {% if area %}
    <textarea id="f-{{ prefix }}{{ name }}" name="{{ prefix }}{{ name }}" rows="3"{% if required %} required{% endif %} class="w-full p-3 border {% if error %}border-red-500{% else %}border-gray-300{% endif %} rounded-lg focus:ring-2 focus:ring-green-500">{{ value|default:'' }}</textarea>
    {% else %}
    <input type="{{ type|default:'text' }}" id="f-{{ prefix }}{{ name }}" name="{{ prefix }}{{ name }}" value="{{ value|default:'' }}"{% if required %} required{% endif %}{% if hint %} placeholder="{{ hint }}"{% endif %}{% if ltr %} dir="ltr"{% endif %}{% if mode %} inputmode="{{ mode }}"{% endif %} class="w-full p-3 border {% if error %}border-red-500{% else %}border-gray-300{% endif %} rounded-lg focus:ring-2 focus:ring-green-500">
    {% endif %}
    {% if error %}<p class="text-sm text-red-600 mt-1">{{ error }}</p>{% endif %}
</div>
