{% load static %}
<!doctype html>
<html lang="fa" dir="rtl">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>مرحله ۸: درخواست پایان کار - ملک آیدی</title>

        <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config={theme:{extend:{colors:{purple:{50:'#eff6ff',100:'#dbeafe',200:'#bfdbfe',300:'#93c5fd',400:'#60a5fa',500:'#3b82f6',600:'#2563eb',700:'#1d4ed8',800:'#1e40af',900:'#1e3a8a'},indigo:{50:'#eff6ff',100:'#dbeafe',200:'#bfdbfe',300:'#93c5fd',400:'#60a5fa',500:'#3b82f6',600:'#2563eb',700:'#1d4ed8',800:'#1e40af',900:'#1e3a8a'},violet:{50:'#eff6ff',100:'#dbeafe',200:'#bfdbfe',300:'#93c5fd',400:'#60a5fa',500:'#3b82f6',600:'#2563eb',700:'#1d4ed8',800:'#1e40af',900:'#1e3a8a'},fuchsia:{50:'#eff6ff',100:'#dbeafe',200:'#bfdbfe',300:'#93c5fd',400:'#60a5fa',500:'#3b82f6',600:'#2563eb',700:'#1d4ed8',800:'#1e40af',900:'#1e3a8a'},pink:{50:'#eff6ff',100:'#dbeafe',200:'#bfdbfe',300:'#93c5fd',400:'#60a5fa',500:'#3b82f6',600:'#2563eb',700:'#1d4ed8',800:'#1e40af',900:'#1e3a8a'},teal:{50:'#eff6ff',100:'#dbeafe',200:'#bfdbfe',300:'#93c5fd',400:'#60a5fa',500:'#3b82f6',600:'#2563eb',700:'#1d4ed8',800:'#1e40af',900:'#1e3a8a'},cyan:{50:'#eff6ff',100:'#dbeafe',200:'#bfdbfe',300:'#93c5fd',400:'#60a5fa',500:'#3b82f6',600:'#2563eb',700:'#1d4ed8',800:'#1e40af',900:'#1e3a8a'},sky:{50:'#eff6ff',100:'#dbeafe',200:'#bfdbfe',300:'#93c5fd',400:'#60a5fa',500:'#3b82f6',600:'#2563eb',700:'#1d4ed8',800:'#1e40af',900:'#1e3a8a'},emerald:{50:'#f0fdf4',100:'#dcfce7',200:'#bbf7d0',300:'#86efac',400:'#4ade80',500:'#22c55e',600:'#16a34a',700:'#15803d',800:'#166534',900:'#14532d'},rose:{50:'#fef2f2',100:'#fee2e2',200:'#fecaca',300:'#fca5a5',400:'#f87171',500:'#ef4444',600:'#dc2626',700:'#b91c1c',800:'#991b1b',900:'#7f1d1d'}}}}}</script>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap"
            rel="stylesheet"
        />

        <style>
            body {
                font-family: "Vazirmatn", sans-serif;
                background-color: #f3f4f6; /* gray-100 */
            }
        </style>
        <link rel="stylesheet" href="{% static 'css/melkid-design.css' %}">
</head>
    <body class="text-gray-800 mk-tw">
        <div class="container mx-auto p-4 md:p-8 max-w-4xl">
            <div class="bg-white p-8 rounded-2xl shadow-lg">
                <!-- Header -->
                <div class="text-center border-b pb-6 mb-8">
                    <i class="fas fa-award text-green-600 text-4xl mb-4"></i>
                    <h1 class="text-3xl font-bold text-gray-800">
                        درخواست پایان کار
                    </h1>
                    <p class="mt-2 text-gray-600">
                        مرحله ۸ از ۸ - برای پرونده #NP-012
                    </p>
                </div>

                <form id="completion-form">
                    <!-- 1. Photo Upload Section -->
                    <div class="mb-8">
                        <h2
                            class="text-xl font-semibold mb-4 border-r-4 border-green-500 pr-4"
                        >
                            ۱. بارگذاری تصاویر نهایی پروژه
                        </h2>
                        <div class="p-6 bg-gray-50 rounded-lg border space-y-6">
                            <p class="text-gray-700">
                                لطفاً تصاویر با کیفیت از مراحل نهایی تکمیل شده
                                ساختمان را بارگذاری کنید.
                            </p>
                            <div>
                                <label
                                    for="facade-upload"
                                    class="block font-medium mb-2"
                                >
                                    <i
                                        class="fas fa-building text-green-600 ml-2"
                                    ></i
                                    >عکس نما (الزامی)
                                </label>
                                <input
                                    type="file"
                                    id="facade-upload"
                                    required
                                    class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-green-50 file:text-green-700 hover:file:bg-green-100"
                                />
                            </div>
                            <div>
                                <label
                                    for="waterproofing-upload"
                                    class="block font-medium mb-2"
                                >
                                    <i
                                        class="fas fa-tint text-green-600 ml-2"
                                    ></i
                                    >عکس ایزوگام (پشت بام) (الزامی)
                                </label>
                                <input
                                    type="file"
                                    id="waterproofing-upload"
                                    required
                                    class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-green-50 file:text-green-700 hover:file:bg-green-100"
                                />
                            </div>
                            <div>
                                <label
                                    for="sidewalk-upload"
                                    class="block font-medium mb-2"
                                >
                                    <i
                                        class="fas fa-road text-green-600 ml-2"
                                    ></i
                                    >عکس پیاده‌روسازی (الزامی)
                                </label>
                                <input
                                    type="file"
                                    id="sidewalk-upload"
                                    required
                                    class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-green-50 file:text-green-700 hover:file:bg-green-100"
                                />
                            </div>
                        </div>
                    </div>

                    <!-- 2. Supervisor Approval Status -->
                    <div class="mb-8">
                        <h2
                            class="text-xl font-semibold mb-4 border-r-4 border-green-500 pr-4"
                        >
                            ۲. وضعیت تأیید توسط ناظر فنی
                        </h2>
                        <div
                            id="supervisor-status"
                            class="p-6 bg-amber-100 text-amber-800 rounded-lg text-center font-semibold flex items-center justify-center"
                        >
                            <i class="fas fa-hourglass-half ml-2"></i>
                            در انتظار ارسال مدارک توسط شما برای بررسی ناظر
                        </div>
                    </div>

                    <!-- Submission Button -->
                    <div class="mt-10 pt-6 border-t text-left">
                        <button
                            type="submit"
                            class="bg-green-600 text-white font-bold px-10 py-4 rounded-lg hover:bg-green-700 transition-all shadow-lg hover:shadow-xl"
                        >
                            ارسال پایان کار
                            <i class="fas fa-paper-plane mr-2"></i>
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <script>
            document
                .getElementById("completion-form")
                .addEventListener("submit", function (event) {
                    event.preventDefault();
                    const facadeUpload =
                        document.getElementById("facade-upload").files.length;
                    const waterproofingUpload = document.getElementById(
                        "waterproofing-upload",
                    ).files.length;
                    const sidewalkUpload =
                        document.getElementById("sidewalk-upload").files.length;

                    if (
                        facadeUpload === 0 ||
                        waterproofingUpload === 0 ||
                        sidewalkUpload === 0
                    ) {
                        alert("لطفاً تمام تصاویر مورد نیاز را بارگذاری کنید.");
                        return;
                    }

                    // Simulate submission and update supervisor status
                    const supervisorStatusDiv =
                        document.getElementById("supervisor-status");
                    supervisorStatusDiv.innerHTML = `
                <i class="fas fa-user-clock ml-2"></i>
                مدارک ارسال شد. در انتظار بررسی و تأیید نهایی توسط ناظر فنی.
            `;
                    supervisorStatusDiv.className =
                        "p-6 bg-blue-100 text-blue-800 rounded-lg text-center font-semibold flex items-center justify-center";

                    alert(
                        "تصاویر شما با موفقیت برای ناظر فنی ارسال شد. (نسخه نمایشی)",
                    );
                });
        </script>
    </body>
</html>
