{% extends 'base.html' %}

{% block title %}ویرایش اطلاعیه - ملک آیدی{% endblock %}

{% block content %}
<div class="container-fluid px-4 py-6" dir="rtl">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0 text-gray-800">
            <i class="fas fa-edit text-primary me-2"></i>
            ویرایش اطلاعیه
        </h1>
        <a href="{% url 'main:announcement_detail' announcement.id %}" class="btn btn-secondary">
            <i class="fas fa-arrow-right me-1"></i>
            بازگشت
        </a>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow">
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        <div class="row">
                            <div class="col-md-8 mb-3">
                                <label for="title" class="form-label">عنوان اطلاعیه <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="title" name="title" required maxlength="200"
                                       value="{{ announcement.title }}">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="priority" class="form-label">اولویت</label>
                                <select class="form-select" id="priority" name="priority">
                                    {% for value, label in announcement.PRIORITY_CHOICES %}
                                    <option value="{{ value }}" {% if value == announcement.priority %}selected{% endif %}>{{ label }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="content" class="form-label">متن اطلاعیه <span class="text-danger">*</span></label>
                            <textarea class="form-control" id="content" name="content" rows="6" required>{{ announcement.content }}</textarea>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">گروه هدف</label>
                                <div class="border rounded p-3" style="max-height: 200px; overflow-y: auto;">
                                    {% for role_code, role_name in role_choices %}
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" name="target_roles"
                                               value="{{ role_code }}" id="role_{{ role_code }}"
                                               {% if role_code in announcement.target_roles %}checked{% endif %}>
                                        <label class="form-check-label" for="role_{{ role_code }}">{{ role_name }}</label>
                                    </div>
                                    {% endfor %}
                                </div>
                                <div class="form-text">اگر هیچ نقشی انتخاب نشود، اطلاعیه برای همه نمایش داده می‌شود.</div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="expires_at" class="form-label">تاریخ انقضا (اختیاری)</label>
                                <input type="datetime-local" class="form-control" id="expires_at" name="expires_at"
                                       value="{{ expires_value }}">
                            </div>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a href="{% url 'main:announcement_detail' announcement.id %}" class="btn btn-outline-secondary">انصراف</a>
                            <button type="submit" class="btn btn-success">
                                <i class="fas fa-save me-1"></i>
                                ذخیره تغییرات
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
