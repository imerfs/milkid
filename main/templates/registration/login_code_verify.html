{% extends 'registration/login_code_base.html' %}
{% block heading %}کد ورود را وارد کنید{% endblock %}
{% block form %}
<p class="text-center text-gray-500 mb-6 text-sm">کد ۶ رقمی فرستاده‌شده به <span dir="ltr">{{ email }}</span> را وارد کنید. کد ۱۰ دقیقه اعتبار دارد.</p>
<form method="post" class="space-y-6">
    {% csrf_token %}
    <div>
        <label for="code" class="block text-sm font-medium text-gray-700 mb-2">کد ورود</label>
        <input type="text" id="code" name="code" dir="ltr" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="one-time-code" autofocus>
    </div>
    <button type="submit" class="w-full bg-green-600 text-white font-bold py-3 rounded-lg hover:bg-green-700 transition-all">ورود</button>
    <p class="text-center text-sm text-gray-500"><a class="text-green-600 hover:underline" href="{% url 'main:login_code_request' %}">ارسال دوبارهٔ کد یا تغییر ایمیل</a></p>
</form>
{% endblock %}
