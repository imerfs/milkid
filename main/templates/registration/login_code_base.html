{% load static %}<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}ورود با ایمیل{% endblock %} - ملک آیدی</title>
    <link rel="stylesheet" href="{% static 'vendor/fontawesome/css/all.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/vazirmatn.css' %}">
    <style>
        body { font-family: "Vazirmatn", "Segoe UI", Tahoma, sans-serif; background-color: #f3f4f6; }
        input[type="email"], input[type="text"] { width: 100%; padding: 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; }
        input:focus { outline: none; border-color: #1e3a8a; box-shadow: 0 0 0 3px rgba(22, 160, 133, 0.1); }
    </style>
    {% include 'partials/seo_head.html' %}
    <link rel="stylesheet" href="{% static 'css/melkid-design.css' %}">
    <link rel="stylesheet" href="{% static 'css/tailwind.css' %}">
</head>
<body class="flex items-center justify-center min-h-screen p-4 mk-tw">
    <div class="container w-full max-w-md">
        <header class="flex items-center justify-between mb-6">
            <div class="flex items-center gap-3">
                <i class="fas fa-home text-2xl text-green-600"></i>
                <p class="text-2xl font-bold text-green-700">ملک آیدی</p>
            </div>
            <a class="text-sm text-gray-600 hover:text-green-700" href="{% url 'main:login' %}">ورود با رمز عبور</a>
        </header>
        <main class="bg-white rounded-2xl shadow-xl p-8">
            <h1 class="text-2xl font-bold text-center text-gray-800 mb-2">{% block heading %}{% endblock %}</h1>
            {% for m in messages %}
                <div class="text-center p-3 rounded-lg text-sm mb-4 {% if m.tags == 'error' %}bg-red-50 text-red-700{% else %}bg-green-50 text-green-800{% endif %}">{{ m }}</div>
            {% endfor %}
            {% block form %}{% endblock %}
        </main>
    </div>
</body>
</html>
