{% extends 'registration/login_code_base.html' %}
{% block heading %}ورود با کد ایمیلی{% endblock %}
{% block form %}
<p class="text-center text-gray-500 mb-6 text-sm">ایمیل حساب خود را وارد کنید تا کد یک‌بارمصرف برایتان فرستاده شود.</p>
<form method="post" class="space-y-6">
    {% csrf_token %}
    <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-2">ایمیل</label>
        <input type="email" id="email" name="email" dir="ltr" maxlength="254" required autocomplete="email">
    </div>
    <button type="submit" class="w-full bg-green-600 text-white font-bold py-3 rounded-lg hover:bg-green-700 transition-all">ارسال کد</button>
</form>
{% endblock %}
