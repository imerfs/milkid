{% if seo.breadcrumbs %}
<nav aria-label="breadcrumb" class="mk-breadcrumb">
    <ol>
        {% for label, url in seo.breadcrumbs %}
        {% if forloop.last %}<li aria-current="page">{{ label }}</li>
        {% else %}<li><a href="{{ url }}">{{ label }}</a></li>
        {% endif %}{% endfor %}
    </ol>
</nav>
{% endif %}
